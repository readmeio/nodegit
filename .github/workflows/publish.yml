name: Publish

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build.yml

  # https://docs.npmjs.com/generating-provenance-statements#publishing-packages-with-provenance-via-github-actions
  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          check-latest: true
          registry-url: "https://registry.npmjs.org"
      # for the publish step, we need a version of npm that supports OIDC (>=
      # 11.5.1, see https://docs.npmjs.com/trusted-publishers),
      - name: upgrade npm for OIDC support
        run: npm install -g npm@^11.5.1
      - name: download built libraries
        id: download
        uses: actions/download-artifact@v4
        with:
          path: prebuilds
      - name: copy libs
        run: |
          set -x
          mkdir -p prebuilds/linux-arm64
          mkdir -p prebuilds/linux-x64
          mkdir -p prebuilds/darwin-arm64
          mkdir -p prebuilds/darwin-x64
          find ${{ steps.download.outputs.download-path }}
          # Merge prebuilds for each platform across all node versions;
          # ABI-tagged filenames don't collide.
          for d in ${{ steps.download.outputs.download-path }}/prebuild-*/; do
            for platarch in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
              [ -d "$d$platarch" ] && mv "$d$platarch"/* "./prebuilds/$platarch/" 2>/dev/null || true
            done
          done
          find ./prebuilds
      - name: npm install
        run: npm ci

      # this works without a token because this repo is configured via OIDC
      # https://docs.npmjs.com/trusted-publishers
      - name: publish
        run: |
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
